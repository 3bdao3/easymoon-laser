<app-page-header
  [title]="isEdit ? 'تعديل خدمة' : 'خدمة جديدة'"
  [subtitle]="'تحديد الاسم ومدد الجلسة'"
>
  <a actions class="btn btn--ghost" routerLink="/app/laser-services">رجوع</a>
</app-page-header>

@if (loading()) {
  <app-loading-spinner label="جاري التحميل…" />
} @else {
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-grid">
      <label class="form-field">
        <span class="form-field__label">اسم الخدمة</span>
        <input class="form-field__input" formControlName="name" />
      </label>
      <label class="form-field">
        <span class="form-field__label">الحد الأدنى (دقيقة)</span>
        <input class="form-field__input" type="number" min="1" formControlName="minDurationMinutes" />
      </label>
      <label class="form-field">
        <span class="form-field__label">الحد الأقصى (دقيقة)</span>
        <input class="form-field__input" type="number" min="1" formControlName="maxDurationMinutes" />
      </label>
      <label class="form-field">
        <span class="form-field__label">ترتيب العرض</span>
        <input class="form-field__input" type="number" formControlName="displayOrder" />
      </label>
      <label class="form-field">
        <span class="form-field__label">السعر (ج.م)</span>
        <input class="form-field__input" type="number" min="0" formControlName="price" />
      </label>
      @if (isEdit) {
        <label class="form-field">
          <span class="form-field__label">الحالة</span>
          <select class="form-field__select" formControlName="isActive">
            <option [ngValue]="true">نشطة</option>
            <option [ngValue]="false">موقوفة</option>
          </select>
        </label>
      }
    </div>
    <label class="form-field">
      <span class="form-field__label">ملاحظات</span>
      <textarea class="form-field__textarea" formControlName="notes" rows="3"></textarea>
    </label>
    <div class="row-actions">
      <button class="btn btn--primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'جاري الحفظ…' : 'حفظ' }}
      </button>
      <a class="btn btn--ghost" routerLink="/app/laser-services">إلغاء</a>
    </div>
  </form>
}
