<form [formGroup]="form()" (ngSubmit)="onSubmit()">
  <div class="form-grid">
    <label class="form-field">
      <span class="form-field__label">الاسم الأول *</span>
      <input class="form-field__input" formControlName="firstName" />
    </label>
    <label class="form-field">
      <span class="form-field__label">اسم العائلة *</span>
      <input class="form-field__input" formControlName="lastName" />
    </label>
    <label class="form-field">
      <span class="form-field__label">اسم العرض</span>
      <input class="form-field__input" formControlName="displayName" />
    </label>
    <label class="form-field">
      <span class="form-field__label">التخصص</span>
      <select class="form-field__select" formControlName="specialtyId">
        <option value="">—</option>
        @for (s of specialties(); track s.id) {
          <option [value]="s.id">{{ s.name }}</option>
        }
      </select>
    </label>
    <label class="form-field">
      <span class="form-field__label">رقم الترخيص</span>
      <input class="form-field__input" formControlName="licenseNumber" />
    </label>
    <label class="form-field">
      <span class="form-field__label">الهاتف</span>
      <input class="form-field__input" formControlName="phoneNumber" />
    </label>
    <label class="form-field">
      <span class="form-field__label">البريد</span>
      <input class="form-field__input" type="email" formControlName="email" />
    </label>
    <label class="form-field">
      <span class="form-field__label">معرف المستخدم</span>
      <input class="form-field__input" formControlName="userId" />
    </label>
  </div>
  <div class="toolbar__actions" style="margin-top: var(--space-4)">
    <ng-content select="[actions]" />
    <button class="btn btn--primary" type="submit" [disabled]="submitting() || form().invalid">حفظ</button>
  </div>
</form>
