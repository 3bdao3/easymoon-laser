<app-page-header [title]="'عيادة جديدة'" [subtitle]="'New clinic'">
  <a actions class="btn btn--ghost" routerLink="..">رجوع</a>
</app-page-header>
<div class="card">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-grid">
      <label class="form-field"><span class="form-field__label">الرمز *</span><input class="form-field__input" formControlName="code" /></label>
      <label class="form-field"><span class="form-field__label">الاسم *</span><input class="form-field__input" formControlName="name" /></label>
      <label class="form-field"><span class="form-field__label">الموقع</span><input class="form-field__input" formControlName="location" /></label>
      <label class="form-field"><span class="form-field__label">الوصف</span><input class="form-field__input" formControlName="description" /></label>
    </div>
    <div class="row-actions">
      <a class="btn btn--ghost" routerLink="..">إلغاء</a>
      <button class="btn btn--primary" type="submit" [disabled]="submitting()">حفظ</button>
    </div>
  </form>
</div>
