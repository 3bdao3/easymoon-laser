<app-page-header
  [title]="isEdit ? 'تعديل عرض' : 'عرض جديد'"
  [subtitle]="'اسم العرض · السعر · مدة الصلاحية'"
>
  <a actions class="btn btn--ghost" routerLink="/app/offers">رجوع</a>
</app-page-header>

@if (loading()) {
  <app-loading-spinner label="جاري التحميل…" />
} @else {
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-grid">
      <label class="form-field">
        <span class="form-field__label">اسم العرض</span>
        <input class="form-field__input" formControlName="title" placeholder="مثال: باكدج 5000 نبضة" />
      </label>
      <label class="form-field">
        <span class="form-field__label">السعر</span>
        <input class="form-field__input" type="number" min="0" step="0.01" formControlName="price" />
      </label>
      <label class="form-field">
        <span class="form-field__label">صالح من</span>
        <input class="form-field__input" type="date" formControlName="validFrom" />
      </label>
      <label class="form-field">
        <span class="form-field__label">صالح حتى</span>
        <input class="form-field__input" type="date" formControlName="validTo" />
      </label>
      <label class="form-field">
        <span class="form-field__label">ترتيب العرض</span>
        <input class="form-field__input" type="number" formControlName="displayOrder" />
      </label>
      @if (isEdit) {
        <label class="form-field">
          <span class="form-field__label">الحالة</span>
          <select class="form-field__select" formControlName="isActive">
            <option [ngValue]="true">نشط</option>
            <option [ngValue]="false">موقوف</option>
          </select>
        </label>
      }
    </div>
    <label class="form-field">
      <span class="form-field__label">تفاصيل العرض</span>
      <textarea
        class="form-field__textarea"
        formControlName="description"
        rows="4"
        placeholder="وصف مختصر للعرض…"
      ></textarea>
    </label>
    <div class="row-actions">
      <button class="btn btn--primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'جاري الحفظ…' : 'حفظ العرض' }}
      </button>
      <a class="btn btn--ghost" routerLink="/app/offers">إلغاء</a>
    </div>
  </form>
}
