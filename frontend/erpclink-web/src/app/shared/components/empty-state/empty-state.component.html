<div class="empty-state">
  <h2 class="empty-state__title">{{ title() }}</h2>
  @if (message()) {
    <p class="empty-state__message">{{ message() }}</p>
  }
  @if (actionLabel()) {
    <button type="button" class="btn btn--primary" (click)="action.emit()">
      {{ actionLabel() }}
    </button>
  }
  <ng-content />
</div>
