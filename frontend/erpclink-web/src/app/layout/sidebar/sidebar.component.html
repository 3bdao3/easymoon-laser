@if (open()) {
  <button type="button" class="sidebar-backdrop" aria-label="إغلاق القائمة" (click)="closeRequested.emit()"></button>
}

<aside class="sidebar" [class.sidebar--open]="open()">
  <div class="sidebar__brand">
    <div class="brand-mark" aria-hidden="true">
      <img src="easy-moon-mark.png" alt="" width="48" height="48" />
    </div>
    <div class="sidebar__brand-text">
      <span class="sidebar__logo">Easy Moon</span>
      <span class="sidebar__tagline">Smooth Skin · Confidence</span>
    </div>
  </div>

  <nav class="sidebar__nav" aria-label="القائمة الرئيسية">
    @for (item of visibleItems(); track item.route) {
      <a
        class="sidebar__link"
        [routerLink]="item.route"
        routerLinkActive="sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: item.route === '/app/dashboard' }"
        (click)="onNavigate()"
      >
        <span class="sidebar__icon" [attr.data-icon]="item.icon || 'home'" aria-hidden="true"></span>
        <span class="sidebar__link-label">{{ item.labelAr }}</span>
      </a>
    }
  </nav>

  <div class="sidebar__art" aria-hidden="true">
    <img src="sidebar-beauty-art.png" alt="" />
  </div>
</aside>
